# Trusted publishing (OIDC) release — matches lutaml-model/.github/workflows/release.yml.
# metanorma/ci switches to OIDC when the rubygems-api-key secret is omitted;
# each gem must be registered for trusted publishing on rubygems.org
# (owner=claricle, workflow=release.yml).
name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch or pre|rc|etc
        required: true
        default: 'skip'
  repository_dispatch:
    types: [ do-release ]

# Least-privilege ceiling for the called rubygems-release.yml: its release job
# needs contents:write (git tag push) and id-token:write (OIDC Trusted Publishing).
permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: metanorma/ci/.github/workflows/rubygems-release.yml@main
    with:
      next_version: ${{ github.event.inputs.next_version }}
