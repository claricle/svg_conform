name: SVGCheck Compatibility

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering
  push:
    branches:
      - main
    paths:
      - 'lib/svg_conform/**'
      - 'spec/svgcheck_compatibility_spec.rb'
      - 'lib/tasks/svgcheck.rake'

jobs:
  compatibility-test:
    runs-on: ubuntu-latest
    name: SVGCheck Compatibility Test

    steps:
      - uses: actions/checkout@v4

      - name: Checkout svgcheck reference repo
        uses: actions/checkout@v4
        with:
          repository: ietf-tools/svgcheck
          path: svgcheck-reference

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.2'
          bundler-cache: true

      - name: Install svgcheck from source
        run: |
          cd svgcheck-reference
          pip install -e .
          cd ..

      - name: Verify svgcheck installation
        run: |
          svgcheck --version

      - name: Generate svgcheck test outputs
        run: |
          bundle exec svg_conform svgcheck generate svgcheck-reference --mode both

      - name: Run compatibility tests
        id: compatibility_tests
        continue-on-error: true
        run: |
          bundle exec rspec spec/svgcheck_compatibility_spec.rb --format documentation | tee test_results.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Check for fixture changes
        id: check_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add spec/fixtures/svgcheck/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes in svgcheck fixtures"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in svgcheck fixtures"
          fi

      - name: Prepare PR body with test results
        if: always()
        run: |
          cat > pr_body.md << 'EOF'
          ## SVGCheck Compatibility Report

          **Workflow Run:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          **Triggered by:** ${{ github.event_name }}
          **Commit:** [\`${{ github.sha }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ### Test Status

          Exit Code: `${{ steps.compatibility_tests.outputs.exit_code }}`

          ### Compatibility Test Results

          <details>
          <summary>Click to expand full test output</summary>

          ```
          $(cat test_results.txt)
          ```

          </details>

          ### Changes

          This PR updates the svgcheck compatibility test fixtures based on the latest svgcheck reference implementation from [ietf-tools/svgcheck](https://github.com/ietf-tools/svgcheck).

          **Updated files:**
          - Test fixture files in `spec/fixtures/svgcheck/check/` (validation outputs)
          - Test fixture files in `spec/fixtures/svgcheck/repair/` (repair outputs)

          ### What to do

          - ✅ **If tests passed and fixtures changed:** Merge this PR to update fixtures
          - ❌ **If tests failed:** Review the test output above to identify compatibility issues
          - 🔍 **If no changes:** This PR can be closed, no fixture updates needed

          ---
          *This PR is automatically created/updated by the SVGCheck Compatibility workflow.*
          EOF

      - name: Create or update PR
        if: always()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update svgcheck compatibility fixtures"
          title: "chore: SVGCheck compatibility report - ${{ github.run_number }}"
          body-path: pr_body.md
          branch: update-svgcheck-fixtures
          delete-branch: true
          labels: |
            automated
            svgcheck-compatibility
